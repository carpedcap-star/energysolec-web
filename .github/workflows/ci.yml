name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacion:
    name: Pruebas unitarias, tipos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Sin Supabase: compila con el almacén de desarrollo, como en local.
      - run: npm run build
        env:
          ALLOW_DEV_STORE: 'true'

  e2e:
    name: Extremo a extremo (Playwright, escritorio y móvil)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # El servidor (next dev con base propia) lo levanta playwright.config.ts. Sin claves: ni Supabase, ni correo, ni IA.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
